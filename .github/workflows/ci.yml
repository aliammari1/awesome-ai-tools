name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Catalog + site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun ci

      - name: Validate structured catalog
        run: bun run validate

      - name: Verify generated README
        run: bun run check:readme

      - name: Lint Awesome list
        run: bun run lint:awesome

      - name: Build Astro site
        run: bun run build

  link-check:
    name: Lychee link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # These official sites are independently verified as live but are not
          # reliable with Lychee's HTTP client (bot-specific status/HTTP2/timeout).
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --max-concurrency 32
            --max-retries 5
            --retry-wait-time 2
            --timeout 30
            --accept 200,202,206,403,405,415,429
            --exclude https://www\\.krea\\.ai/
            --exclude https://mailstrom\\.co/
            --exclude https://www\\.clarifai\\.com/
            --exclude https://www\\.coursera\\.org/browse/data-science/machine-learning
            --exclude https://www\\.rankingrider\\.com/
            README.md
          fail: true
