name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
    types: [checks_requested]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"

jobs:
  catalog:
    name: Catalog
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Install locked dependencies
        run: bun ci

      - name: Validate structured catalog
        run: bun run validate

      - name: Verify generated README
        run: bun run check:readme

      - name: Lint Awesome list
        run: bun run lint:awesome

  dependency-review:
    name: Dependency security
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime,development,unknown
          show-openssf-scorecard: true
          show-patched-versions: true

  changed-links:
    name: Changed links
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract URLs added by this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git diff \
            --unified=0 \
            --no-color \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            -- . \
            ':(exclude)bun.lock' \
            ':(exclude)package-lock.json' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)yarn.lock' \
          | awk '
              /^\+\+\+ / { next }
              /^\+/ {
                sub(/^\+/, "")
                print
              }
            ' \
          | grep -Eo 'https?://[^[:space:]<>()\[\]{}"]+' \
          | sed -E 's/[.,;:!?]+$//' \
          | sort -u \
          > .changed-urls.txt || true

          if [[ -s .changed-urls.txt ]]; then
            echo "URLs introduced or changed by this PR:"
            cat .changed-urls.txt
          else
            echo "No new external URLs found."
          fi

      - name: Check changed URLs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          token: ${{ github.token }}
          args: >-
            --no-progress
            --exclude-all-private
            --max-concurrency 8
            --host-concurrency 2
            --host-request-interval 500ms
            --max-retries 2
            --retry-wait-time 2
            --timeout 20
            --exclude https://www\\.krea\\.ai/
            --exclude https://mailstrom\\.co/
            --exclude https://www\\.clarifai\\.com/
            --exclude https://www\\.coursera\\.org/browse/data-science/machine-learning
            --exclude https://www\\.rankingrider\\.com/
            .changed-urls.txt
          format: markdown
          jobSummary: true
          failIfEmpty: false
          fail: true

  pr-gate:
    name: PR gate
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    needs: [catalog, dependency-review, changed-links]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require all PR checks
        env:
          CATALOG: ${{ needs.catalog.result }}
          DEPENDENCIES: ${{ needs.dependency-review.result }}
          LINKS: ${{ needs.changed-links.result }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$CATALOG" == "success" ]]
          [[ "$DEPENDENCIES" == "success" ]]
          [[ "$LINKS" == "success" ]]

  merge-gate:
    name: Merge gate
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout merge group
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Install locked dependencies
        run: bun ci

      - name: Validate structured catalog
        run: bun run validate

      - name: Verify generated README
        run: bun run check:readme

      - name: Lint Awesome list
        run: bun run lint:awesome

      - name: Build Astro site
        run: bun run build
