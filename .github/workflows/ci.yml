name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: Catalog + site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Detect committed lockfile
        id: lock
        shell: bash
        run: |
          if git ls-files --error-unmatch bun.lock >/dev/null 2>&1; then
            echo "tracked=true" >> "$GITHUB_OUTPUT"
          else
            echo "tracked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install

      - name: Commit generated Bun lockfile once
        if: steps.lock.outputs.tracked == 'false' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          base64 -w 0 bun.lock > /tmp/bun-lock.b64
          jq -n \
            --arg message "chore: commit Bun lockfile" \
            --rawfile content /tmp/bun-lock.b64 \
            --arg branch "$HEAD_BRANCH" \
            '{message: $message, content: $content, branch: $branch}' \
            > /tmp/bun-lock-request.json
          gh api \
            --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/bun.lock" \
            --input /tmp/bun-lock-request.json

      - name: Validate structured catalog
        run: bun run validate

      - name: Verify generated README
        run: bun run check:readme

      - name: Lint Awesome list
        run: bun run lint:awesome

      - name: Build Astro site
        run: bun run build

  link-check:
    name: Lychee link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # These official sites are independently verified as live but are not
          # reliable with Lychee's HTTP client (bot-specific status/HTTP2/timeout).
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --max-concurrency 32
            --max-retries 5
            --retry-wait-time 2
            --timeout 30
            --accept 200,202,206,403,405,415,429
            --exclude https://www\\.krea\\.ai/
            --exclude https://mailstrom\\.co/
            --exclude https://www\\.clarifai\\.com/
            --exclude https://www\\.coursera\\.org/browse/data-science/machine-learning
            README.md
          fail: true
