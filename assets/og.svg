<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Awesome AI Tools, a curated AI tool directory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#0f1520"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="340" fill="url(#glow)"/>

  <rect x="80" y="72" width="62" height="62" rx="15" fill="url(#mark)"/>
  <text x="111" y="113" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">AI</text>
  <text x="162" y="113" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="33" font-weight="600" fill="#ffffff">Awesome AI Tools</text>
  <text x="162" y="146" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3.4" fill="#6f93b8">CURATED AI TOOL DIRECTORY</text>

  <text x="80" y="323" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">Find tools for the work</text>
  <text x="80" y="393" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">you actually need to do.</text>

  <text x="80" y="460" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="29" fill="#b6c2d4">Search by task. Compare what the catalog records.</text>

  <line x1="80" y1="530" x2="1120" y2="530" stroke="#243041" stroke-width="1"/>

  <text x="80" y="574" font-family="DejaVu Sans Mono, monospace" font-size="24" fill="#93c5fd">docs.aliammari.dev</text>
  <text x="1120" y="574" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#5f7188">github.com/aliammari1/awesome-ai-tools</text>
</svg>
